workflows:
  ios-unsigned:
    name: GestaltReset iOS (unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GestaltReset.xcodeproj"
        XCODE_SCHEME: "GestaltReset"
        BUILD_CONFIGURATION: "Release"
        DERIVED_DATA_PATH: "$CM_BUILD_DIR/build/ios/DerivedData"
        IPA_OUTPUT_DIR: "$CM_BUILD_DIR/build/ios/ipa"

    scripts:
      - name: Verify Xcode project and scheme
        script: |
          set -euo pipefail

          if [ ! -d "$XCODE_PROJECT" ]; then
            echo "ERROR: $XCODE_PROJECT was not found."
            echo "This repository currently has source files but no committed Xcode project."
            echo "Add GestaltReset.xcodeproj with the GestaltReset scheme before building."
            exit 1
          fi

          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build app without code signing
        script: |
          set -euo pipefail

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION-iphoneos/$XCODE_SCHEME.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Expected app product was not created: $APP_PATH"
            exit 1
          fi

          rm -rf "$IPA_OUTPUT_DIR"
          mkdir -p "$IPA_OUTPUT_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_OUTPUT_DIR/Payload/"

          (
            cd "$IPA_OUTPUT_DIR"
            /usr/bin/zip -qry "GestaltReset-unsigned.ipa" Payload
          )

          echo "Created unsigned IPA:"
          ls -lh "$IPA_OUTPUT_DIR/GestaltReset-unsigned.ipa"

    artifacts:
      - build/ios/ipa/GestaltReset-unsigned.ipa
      - build/ios/DerivedData/Build/Products/Release-iphoneos/GestaltReset.app
