name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Verify Xcode Project
        run: |
          if [ ! -f "GestaltReset.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: GestaltReset.xcodeproj/project.pbxproj not found!"
            exit 1
          fi

      - name: Build Unsigned App
        run: |
          xcodebuild build \
            -project GestaltReset.xcodeproj \
            -scheme GestaltReset \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/GestaltReset.app build/Payload/
          cd build
          zip -qry GestaltReset.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltReset-unsigned-ipa
          path: build/GestaltReset.ipa
